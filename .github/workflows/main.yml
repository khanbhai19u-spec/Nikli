name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        id: p
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle not found. Files in repo:"
            find . -type f -not -path './.git/*'
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nikli-Directory-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
